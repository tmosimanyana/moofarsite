<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Contact — Moofar Pty Ltd</title>
  <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <img src="assets/logo.svg" alt="Moofar logo">
    <h1>Moofar Pty Ltd</h1>
  </div>
  <nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<main class="container fade-in">
  <h1>Contact Us</h1>
  <p>Fill out the form or reach us via phone or email for a free quote!</p>

  <div class="contact-form-wrapper">
    <form class="contact-form">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your Name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Your Email" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Your Message" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>
</main>

<footer>
  <div class="container footer-grid">
    <div><strong>Moofar Pty Ltd</strong></div>
    <div class="center muted">© <span id="year"></span> Moofar Pty Ltd</div>
    <div style="text-align:right">
      <div><b>Phone</b>: +267 777 723 232</div>
      <div><b>Email</b>: info@moofar.co.bw</div>
    </div>
  </div>
</footer>

<script src="scripts/script.js"></script>
</body>
</html>
