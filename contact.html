<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Moofar Pty Ltd</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><img src="assets/logo.svg" alt="Moofar Logo"></a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- Gallery Section -->
    <section class="gallery">
        <div class="section-header">
            <div class="section-subtitle">Our Work</div>
            <h2 class="section-title">Recent Projects</h2>
            <p class="section-description">Explore our portfolio of completed projects.</p>
        </div>
        <div class="gallery-grid">
            <div class="gallery-item"><img src="images/project1.jpg" alt="Project 1"><div class="gallery-overlay"><h3>Residential Garden</h3></div></div>
            <div class="gallery-item"><img src="images/project2.jpg" alt="Project 2"><div class="gallery-overlay"><h3>Commercial Landscaping</h3></div></div>
            <div class="gallery-item"><img src="images/project3.jpg" alt="Project 3"><div class="gallery-overlay"><h3>Land Clearing</h3></div></div>
            <div class="gallery-item"><img src="images/project4.jpg" alt="Project 4"><div class="gallery-overlay"><h3>Garden Renovation</h3></div></div>
            <div class="gallery-item"><img src="images/project5.jpg" alt="Project 5"><div class="gallery-overlay"><h3>Fencing & Landscaping</h3></div></div>
        </div>
    </section>

    <!-- Footer (Same as index) -->
    <footer>
        <!-- ...same footer code... -->
    </footer>

    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('active');
        }

        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 100) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>
</body>
</html>
