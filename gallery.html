  <style>
    :root {
      --gap: 1.5rem; /* 24px */
      --radius: 12px;
    }

    body {
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #fafafa;
      color: #111;
      margin: 0;
      padding: 0;
    }

    header, footer {
      text-align: center;
      padding: 1rem;
    }

    .gallery-container {
      max-width: 800px; /* container width used to compute sizes */
      margin: 0 auto;
      padding: 2rem 1rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: var(--gap);
      justify-items: center;
    }

    .gallery-item {
      width: 100%;
      display: block;
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform .28s ease;
      text-decoration: none;
      color: inherit;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: var(--radius);
      transition: transform .28s ease, opacity .28s ease;
      vertical-align: middle;
    }

    .gallery-item:hover img,
    .gallery-item:focus img {
      transform: scale(1.05);
      opacity: .95;
    }

    /* Lightbox overlay using :target */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 2rem;
    }

    .lightbox:target {
      display: flex;
    }

    .lightbox img {
      max-width: 92%;
      max-height: 84%;
      border-radius: 10px;
      box-shadow: 0 8px 40px rgba(0,0,0,.6);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 36px;
      font-size: 2rem;
      color: #fff;
      text-decoration: none;
      line-height: 1;
    }

    .close-btn:hover {
      color: #f5a623;
    }

    /* Visible focus outline for keyboard users */
    .gallery-item:focus {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }
  </style>
</head>
