<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us | Moofar Proprietary Limited</title>
  <meta name="description" content="Get in touch with Moofar Proprietary Limited for professional landscaping and garden maintenance services in Botswana." />
  <link rel="stylesheet" href="styles/moofar.css" />
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ===== HEADER ===== -->
  <header>
    <img src="images/logo-landscape.jpeg" alt="Moofar Proprietary Limited logo" class="site-logo" />
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- ===== MAIN ===== -->
  <main id="main-content">
    <h1>Contact Us</h1>
    <p>We’d love to hear from you! Fill out the form below and our team will get back to you as soon as possible.</p>

    <form id="contactForm" novalidate>
      <label for="name">Full name *</label>
      <input id="name" name="name" type="text" required />

      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" />

      <label for="message">Message *</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <!-- Honeypot: bots will fill this; humans won't see it -->
      <div style="display:none;">
        <label>Leave this field empty</label>
        <input name="website" id="website" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <!-- Optional reCAPTCHA (future) -->
      <input type="hidden" name="recaptchaToken" id="recaptchaToken" />

      <button type="submit">Send Message</button>

      <div id="formMessage" role="alert" aria-live="polite"></div>
    </form>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <p>&copy; 2025 Moofar Proprietary Limited | Website Design by Tinny M</p>
    <div class="socialmedia">
      <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
      <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a>
      <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
    </div>
  </footer>

  <!-- ===== CONTACT FORM SCRIPT ===== -->
  <script>
  (function () {
    const form = document.getElementById('contactForm');
    const status = document.getElementById('formMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.textContent = '';

      const data = {
        name: form.name.value.trim(),
        email: form.email.value.trim(),
        phone: form.phone.value.trim(),
        message: form.message.value.trim(),
        website: form.website.value.trim(), // honeypot
        // recaptchaToken: document.getElementById('recaptchaToken').value // optional
      };

      // Simple validation
      if (!data.name || !data.email || !data.message) {
        status.textContent = 'Please complete your name, email, and message.';
        return;
      }

      status.textContent = 'Sending...';

      try {
        const resp = await fetch('/.netlify/functions/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        const json = await resp.json();
        if (resp.ok && json.ok) {
          status.textContent = '✅ Thank you! Your message has been sent successfully.';
          form.reset();
        } else {
          const err = json && json.error ? json.error : 'Server error';
          status.textContent = '❌ Error: ' + err;
        }
      } catch (err) {
        status.textContent = '❌ Network error. Please try again later.';
        console.error(err);
      }
    });
  })();
  </script>
</body>
</html>
