<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us | Moofar Pty Ltd</title>
  <meta name="description" content="Contact Moofar Pty Ltd for professional landscaping services in Botswana." />
  <link rel="stylesheet" href="css/moofar.css" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
</head>
<body>
<header>
  <div class="container">
    <div class="logo">
      <img src="assets/logo.svg" alt="Moofar Pty Ltd logo" />
      <span class="brand-name">Moofar Pty Ltd</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
    <button class="menu-btn" onclick="toggleMenu()" aria-expanded="false">☰</button>
  </div>
</header>

<main>
  <section class="contact-intro fade-in" data-animate>
    <h1>Contact Us</h1>
    <p>Reach out to Moofar Pty Ltd for professional landscaping services in Botswana.</p>
  </section>

  <section class="contact-form-wrapper fade-in" aria-labelledby="contact-heading">
    <form id="contact-form" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/success.html" class="contact-form" aria-label="Contact form">
      <input type="hidden" name="form-name" value="contact" />
      <p class="sr-only">
        <label>Don't fill this out if you're human: <input name="bot-field" /></label>
      </p>

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>
      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required />
      </div>
      <div class="form-group">
        <label for="message">Your Message</label>
        <textarea id="message" name="message" rows="5" placeholder="Tell us how we can help" required></textarea>
      </div>
      <button type="submit">Send Message</button>
    </form>
  </section>
</main>

<footer>
  <div class="container">
    <p>© <span id="year"></span> Moofar Pty Ltd | Landscaping Services in Botswana</p>
  </div>
</footer>

<script src="js/moofar.js" defer></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
