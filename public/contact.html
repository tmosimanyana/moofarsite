<!-- contact.html (form snippet) -->
<form id="contactForm" novalidate>
  <label for="name">Full name *</label>
  <input id="name" name="name" type="text" required />

  <label for="email">Email *</label>
  <input id="email" name="email" type="email" required />

  <label for="phone">Phone</label>
  <input id="phone" name="phone" type="tel" />

  <label for="message">Message *</label>
  <textarea id="message" name="message" rows="6" required></textarea>

  <!-- Honeypot: bots will fill this; humans won't see it -->
  <div style="display:none;">
    <label>Leave this field empty</label>
    <input name="website" id="website" type="text" tabindex="-1" autocomplete="off" />
  </div>

  <!-- Optional: reCAPTCHA token will be added here if you use reCAPTCHA -->
  <input type="hidden" name="recaptchaToken" id="recaptchaToken" />

  <button type="submit">Send message</button>

  <div id="formMessage" role="alert" aria-live="polite"></div>
</form>

<script>
(function () {
  const form = document.getElementById('contactForm');
  const status = document.getElementById('formMessage');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    status.textContent = '';

    const data = {
      name: form.name.value.trim(),
      email: form.email.value.trim(),
      phone: form.phone.value.trim(),
      message: form.message.value.trim(),
      website: form.website.value.trim(), // honeypot
      // recaptchaToken: document.getElementById('recaptchaToken').value // optional
    };

    // Simple client-side validation
    if (!data.name || !data.email || !data.message) {
      status.textContent = 'Please complete name, email and message.';
      return;
    }

    try {
      const resp = await fetch('/.netlify/functions/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await resp.json();
      if (resp.ok && json.ok) {
        status.textContent = 'Thanks! Your message was sent successfully.';
        form.reset();
      } else {
        const err = json && json.error ? json.error : 'Server error';
        status.textContent = 'Error: ' + err;
      }
    } catch (err) {
      status.textContent = 'Network error. Please try again later.';
      console.error(err);
    }
  });
})();
</script>
